x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    restart: unless-stopped
    image: postgis/postgis:17-3.6
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      # Check over TCP: during first-time init the entrypoint runs a temporary
      # socket-only server, so a socket check reports healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    logging: *logging
    restart: unless-stopped
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PORT: "4000"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_UPLOAD_DIR: /app/uploads
      PRIVATE_UPLOAD_DIR: /app/private-uploads
    volumes:
      - public-uploads:/app/uploads
      - private-uploads:/app/private-uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    logging: *logging
    restart: unless-stopped
    build:
      context: ./web
      args:
        NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
        SITE_URL: ${SITE_URL:-}

  nginx:
    logging: *logging
    restart: unless-stopped
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app.conf:/etc/nginx/app.conf:ro
      - ./certbot-www:/var/www/certbot:ro
      - public-uploads:/srv/uploads:ro
    depends_on:
      - api
      - web

  loki:
    logging: *logging
    restart: unless-stopped
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./monitoring/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  alloy:
    logging: *logging
    restart: unless-stopped
    image: grafana/alloy:v1.20.1
    command: run --disable-reporting --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only protects the socket file, not access to the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    logging: *logging
    restart: unless-stopped
    image: grafana/grafana:13.2.3
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki

volumes:
  db-data:
  public-uploads:
  private-uploads:
  loki-data:
  alloy-data:
  grafana-data:
