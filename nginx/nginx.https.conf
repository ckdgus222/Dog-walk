events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    server {
        listen 80;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/dogwalk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dogwalk/privkey.pem;

        include /etc/nginx/app.conf;
    }
}
