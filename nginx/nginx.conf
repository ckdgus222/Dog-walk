events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    server {
        listen 80;

        # Let's Encrypt checks domain ownership by fetching a file from here.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        include /etc/nginx/app.conf;
    }
}
